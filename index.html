<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Track Lap Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Race Track Lap Analyzer</h1>
    <div class="controls">
        <span>Upload KML files:</span>
        <input type="file" id="kml-upload" multiple accept=".kml">
        <button id="toggle-edit-btn" disabled>Toggle Edit Mode</button>
        <button id="toggle-move-btn" disabled>Move Line</button>
        <button id="export-driven-line-btn" disabled>Export Driven Line</button>
        <button id="compute-borders-btn" disabled>Compute Track Borders</button>
    </div>
    <div id="map"></div>
    <script src="app.js"></script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&libraries=geometry"></script>
</body>
</html>
